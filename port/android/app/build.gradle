plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// Use the same commit-count fallback as tools/ci_build.py, including direct
// Gradle builds. Resolve from the repository root, not the Android subproject.
def buildNumberText = System.getenv("HALO_BUILD_NUMBER")?.trim()
if (!buildNumberText?.isInteger()) {
    def gitCount = providers.exec {
        workingDir new File(rootDir, "../..")
        commandLine "git", "rev-list", "--count", "HEAD"
    }
    buildNumberText = gitCount.standardOutput.asText.get().trim()
}
def buildNumber = buildNumberText.toInteger()
if (buildNumber < 1 || buildNumber > 2100000000) {
    throw new GradleException("HALO_BUILD_NUMBER must be between 1 and 2100000000")
}

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId "com.halo.decomp"
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, buildNumber)
        versionName "4.0"
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
